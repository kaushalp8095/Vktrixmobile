name: Debug flutter test
on:
  push:
    branches: [arena/20cedaa2-vktrixmobile]
permissions:
  contents: read
  pull-requests: write
jobs:
  cat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter test
        run: |
          set +e
          flutter test --no-pub --reporter expanded > /tmp/ft.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { echo '### flutter test output (debug workflow, will be removed)'; echo '```'; tail -c 20000 /tmp/ft.log; echo '```'; } > /tmp/body.md
            gh pr comment arena/20cedaa2-vktrixmobile --body-file /tmp/body.md || true
          fi
          tail -c 4000 /tmp/ft.log
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
