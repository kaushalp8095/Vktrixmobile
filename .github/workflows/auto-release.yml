name: Auto Release and Version JSON

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/auto-release.yml'
      
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          
      - name: Generate Version Code
        id: version
        run: |
          EPOCH_SECONDS=$(date -u +%s)
          # Generate a somewhat shorter build number based on days to fit in Android limits
          BUILD_NUMBER=$(( (EPOCH_SECONDS / 86400) + GITHUB_RUN_NUMBER ))
          VERSION_NAME="1.0.0.$BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
        
      # In-app updates only install over the existing app when EVERY release is signed
      # with the same key. Without these secrets the runner's random debug key is used
      # and Android rejects the update ("App not installed"), so fail loudly instead.
      - name: Prepare persistent Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret ${name}. Releases must use the persistent signing key or in-app updates cannot install."
              exit 1
            fi
          done
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          test -s keystore/release.jks
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/keystore/release.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore/key.properties

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version_name }} --build-number=${{ steps.version.outputs.build_number }}
        
      - name: Show APK signing certificate
        run: keytool -printcert -jarfile app/build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256" || true

      - name: Create version.json
        run: |
          # App installer kholne se pehle isi hash se APK verify karti hai — adhoora
          # ya CDN se badla hua file install nahi ho sakta.
          SHA256=$(sha256sum app/build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          echo "APK SHA-256: $SHA256"
          cat > app/version.json << EOF
          {
            "versionCode": ${{ steps.version.outputs.build_number }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version_name }}/app-release.apk",
            "sha256": "$SHA256",
            "releaseNotes": "Auto-generated release v${{ steps.version.outputs.version_name }}",
            "minVersionCode": 1,
            "forceUpdate": false
          }
          EOF
          
      - name: Commit version.json
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/version.json
          if git diff-index --quiet HEAD; then
            echo "version.json already up to date."
            exit 0
          fi
          git commit -m "chore: auto-update version.json to v${{ steps.version.outputs.version_name }}"
          # Build ke 9 minute me doosra workflow (goldens bot) main par push kar
          # sakta hai — seedha `git push` non-fast-forward se fail hota hai aur
          # APK release hi nahi banti (Oct 26 ko yahi hua tha). Rebase karke retry.
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push; then
              echo "version.json pushed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::push attempt $attempt failed — retrying after a short wait."
            sleep 10
          done
          echo "::error::Could not push version.json after 3 attempts. Release not published."
          exit 1
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          body: "Automated release of v${{ steps.version.outputs.version_name }}"
          files: app/build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
