name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: flutter test (tmp diagnostics)
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee /tmp/out.txt || {
            msg=$(grep -m1 -A45 "EXCEPTION CAUGHT BY RENDERING" /tmp/out.txt | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter-test-diagnostics::$msg"
            exit 1
          }
