name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Analyzer output ko check-run annotations me bhi likhte hain: Actions ka
      # log blob storage kabhi-kabhi reachable nahi hota, par annotations API se
      # padhe ja sakte hain (file:line + message seedha PR me dikhta hai).
      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/analyze.log"
          status=${PIPESTATUS[0]}
          python3 ../.github/scripts/analyze_annotations.py "$RUNNER_TEMP/analyze.log" || true
          exit $status
      # Test failures ko annotations me bhi likhte hain (log blob kabhi-kabhi
      # reachable nahi hota) — warna PR par sirf "4 failed" dikhta hai.
      - name: Flutter tests
        run: |
          set +e
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          [ $status -eq 0 ] || python3 ../.github/scripts/test_annotations.py "$RUNNER_TEMP/test.log"
          exit $status
      # Catches AndroidManifest/FileProvider and Kotlin MethodChannel errors that
      # widget tests cannot see (PDF save + WhatsApp attachment sharing).
      - run: flutter build apk --debug --no-pub
