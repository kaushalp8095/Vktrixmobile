name: Update goldens

# Regenerates app/goldens/*.png after an intentional UI change (new field,
# moved row, changed label) and pushes them back to the branch.
#
# Runs when UI code changes on a branch. The bot's own commit only touches
# app/goldens/**, which is not in the `paths` filter, so it cannot loop.
#
# Can also be started by hand from the Actions tab once this file is on the
# repository's default branch.
#
# Review the committed PNGs before trusting them: a golden only proves "the
# layout changed", not "the layout is right".
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/lib/**'
      - 'app/test/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/update-goldens.yml'

permissions:
  contents: write

concurrency:
  group: update-goldens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goldens:
    name: Regenerate Flutter goldens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Regenerate goldens
        run: flutter test --no-pub --update-goldens

      - name: Verify the suite is green with the new goldens
        run: flutter test --no-pub

      - name: Commit and push if anything changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain goldens)" ]; then
            echo "Goldens already up to date - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goldens
          git commit -m "chore: regenerate Flutter goldens"
          git push origin "HEAD:$BRANCH"
