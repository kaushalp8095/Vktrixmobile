name: mobile_shop
description: Old mobile shop - Buy, Sell, Stock, Reports
publish_to: 'none'
version: 1.0.0+1
environment:
  # mobile_scanner 7.x needs Dart 3.7+ (Flutter 3.29+).
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2   # ID proof photo: camera ya gallery
  image: ^4.5.4         # on-device document compression, off the UI isolate
  dynamic_color: ^1.7.0
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.14.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
