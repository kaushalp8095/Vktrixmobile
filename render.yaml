# Render Blueprint: backend + PostgreSQL ek click me
services:
  - type: web
    name: vktrix-backend
    runtime: node
    region: singapore
    plan: starter            # free bhi chalega, par 15 min baad so jata hai
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_CLIENT
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: vktrix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: SUPERADMIN_PASSWORD
        sync: false          # Render dashboard me khud daalein
      # Free TAC catalogs sab default URLs se chalte hain — koi key zaroori nahi.
      # Zaroorat ho to Render dashboard me ye optional vars daal sakte hain:
      #   TAC_SYNC_TACDB_URL / TAC_SYNC_TACDB_TIMEOUT_MS / TAC_SYNC_TACDB_MAX_MB /
      #   TAC_SYNC_TACDB_MIN_ROWS / TAC_SYNC_TACDB_REFRESH_OSMOCOM (docs dekhein)
      #   TAC_API_URL + TAC_API_KEY  (optional paid/free TAC API, sirf catalog miss par)
databases:
  - name: vktrix-db
    region: singapore
    plan: basic-256mb
    databaseName: mobileshop
    user: shopuser
