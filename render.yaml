# Render Blueprint: backend + PostgreSQL ek click me
services:
  - type: web
    name: vktrix-backend
    runtime: node
    region: singapore
    plan: starter            # free bhi chalega, par 15 min baad so jata hai
    rootDir: backend
    # npm ci lockfile par exact install karta hai (supply-chain ke liye `npm install`
    # se behtar). Dev dependencies production image me nahi chahiye.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Node 20 ka support April 2026 me khatam ho gaya — bina security patches.
      - key: NODE_VERSION
        value: "22"
      # Bina iske auth guards (JWT_SECRET, SUPERADMIN_PASSWORD) production ke liye
      # chalu hi nahi hote, aur Cookies/CORS policies dev mode me rehti hain.
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: pg
      # Render ek proxy ke peeche chalta hai: asli client IP X-Forwarded-For me
      # aata hai. Iske bina rate limit sab users ko ek hi bucket me daal deta hai.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: vktrix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: SUPERADMIN_PASSWORD
        sync: false          # Render dashboard me khud daalein
      # Free TAC catalogs sab default URLs se chalte hain — koi key zaroori nahi.
      # Zaroorat ho to Render dashboard me ye optional vars daal sakte hain:
      #   TAC_SYNC_TACDB_URL / TAC_SYNC_TACDB_TIMEOUT_MS / TAC_SYNC_TACDB_MAX_MB /
      #   TAC_SYNC_TACDB_MIN_ROWS / TAC_SYNC_TACDB_REFRESH_OSMOCOM (docs dekhein)
      #   TAC_API_URL + TAC_API_KEY  (optional paid/free TAC API, sirf catalog miss par)
databases:
  - name: vktrix-db
    region: singapore
    plan: basic-256mb
    databaseName: mobileshop
    user: shopuser
